# Las pruebas del repositorio, en cada push a main y en cada pull request.
#
# Hasta ahora no había ninguna: las 1322 pruebas del backend y las tres
# comprobaciones del frontend solo corrían si alguien se acordaba, y una rama de
# 25 commits podía entrar a main sin que nada la mirase.
#
# Esto no era viable hasta hace poco. En un checkout limpio fallaban 12 pruebas
# por configuración del propio repositorio —`phpunit.xml` fijaba `CACHE_DRIVER`,
# que Laravel dejó de leer en la 11, y `.env.example` traía `APP_LOCALE=en`
# cuando la aplicación corre en español—, así que un CI habría nacido en rojo.
# Se arreglaron en el PR #160; esto es lo que aquello hizo posible.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: lo que importa
# es si el último commit está bien, no el penúltimo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Pest sobre PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        # El mismo motor que en desarrollo. Importa: el módulo SSO usa
        # agregados propios de PostgreSQL —`EXTRACT(EPOCH …)` sobre columnas
        # `time`, comparaciones `jsonb`, un índice único parcial—, así que
        # probar sobre SQLite no probaría lo mismo.
        image: postgres:16
        env:
          POSTGRES_USER: sgth
          POSTGRES_PASSWORD: sgth
          # `phpunit.xml` fija `DB_DATABASE=sgth_testing`; la base tiene que
          # llamarse igual o las migraciones no encuentran dónde aplicarse.
          POSTGRES_DB: sgth_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Van como variables de entorno reales y no en el `.env`: Laravel no
      # sobrescribe con el `.env` lo que ya está en el entorno, así que esto
      # manda sin tener que editar el archivo.
      #
      # La conexión también: `phpunit.xml` la fija para las pruebas, pero
      # `artisan migrate` corre fuera de phpunit y leería el `sqlite` del
      # ejemplo, migrando un archivo local en vez de la base del servicio.
      DB_CONNECTION: pgsql
      DB_DATABASE: sgth_testing
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: sgth
      DB_PASSWORD: sgth

    defaults:
      run:
        working-directory: sgth-backend

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          # `composer.json` pide ^8.3; se usa 8.4, que es la de desarrollo.
          php-version: '8.4'
          # Las mismas que tiene el entorno de desarrollo donde la suite pasa.
          # `zip` y `gd` no son opcionales: `maatwebsite/excel` exporta con la
          # primera y `simple-qrcode` dibuja con la segunda, y de eso viven las
          # pruebas de Reportería.
          extensions: pdo_pgsql, pgsql, mbstring, intl, gd, zip, exif, fileinfo
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: sgth-backend/vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('sgth-backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar el entorno
        # Sin tocar nada del ejemplo: que la suite pase con la configuración que
        # el repositorio entrega es justamente lo que esto tiene que vigilar.
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrar
        run: php artisan migrate --force

      - name: Pruebas
        run: ./vendor/bin/pest

      # ── Cuando el job cae, quién falló de verdad ────────────────────
      #
      # El backend cae de vez en cuando con `SQLSTATE[25P02]: current
      # transaction is aborted` durante la construcción del esquema, y siempre
      # se lo lleva `UsuarioFeatureTest`, que no tiene nada que ver: es el
      # primer test de Feature de la suite, y ahí es donde `RefreshDatabase`
      # dispara el `migrate:fresh`.
      #
      # `25P02` no es el error original. Significa que ALGO ANTERIOR de esa
      # transacción falló y PostgreSQL rechaza el resto hasta el ROLLBACK, así
      # que la sentencia que sale acusada es solo la siguiente que pasó por
      # ahí — por eso cambia entre ocurrencias: `password_reset_tokens add
      # primary key` el 27-09, `users_email_unique` el 28-09,
      # `role_has_permissions_..._foreign` el 25-09.
      #
      # El primer error sí queda en el log del SERVIDOR, que en la imagen
      # oficial va a la salida estándar del contenedor: PostgreSQL registra por
      # defecto los ERROR y, con `log_min_error_statement = error`, también la
      # sentencia que los provocó. Esto lo vuelca para no tener que volver a
      # adivinar. Reejecutar sigue siendo la salida rápida; esto es para la
      # próxima vez que haya que entenderlo.
      - name: Log de PostgreSQL cuando el job falla
        if: failure()
        # El volcado no puede tumbar el job por su cuenta: ya está caído y lo
        # que interesa es leerlo.
        continue-on-error: true
        # `bash` a secas y no el `bash -e` que Actions pone por defecto: aquí
        # ninguna línea debe cortar el volcado, y un `grep` sin coincidencias
        # devuelve 1 sin que eso sea un problema.
        shell: bash
        run: |
          contenedor=$(docker ps -a --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -1)

          if [ -z "$contenedor" ]; then
            # Por si la imagen del servicio cambia de versión y el filtro por
            # `ancestor` deja de acertar.
            contenedor=$(docker ps -a --format '{{.ID}} {{.Image}}' | grep -i postgres | head -1 | cut -d' ' -f1)
          fi

          if [ -z "$contenedor" ]; then
            echo 'No se encontró el contenedor de PostgreSQL.'
            exit 0
          fi

          registro=$(docker logs "$contenedor" 2>&1)

          echo '::group::Errores del servidor PostgreSQL'
          # El PRIMERO de la lista es el que importa: es el que abortó la
          # transacción, y los `25P02` que vienen detrás son su eco.
          #
          # El resultado se guarda antes de imprimirlo: en una tubería el estado
          # de salida es el del último mandato, así que un `grep | head || echo`
          # no llegaría nunca al `echo` aunque no hubiera ni una coincidencia.
          # `-A 2` porque el valor está en las dos líneas siguientes: PostgreSQL
          # pone el `DETAIL:` y, sobre todo, el `STATEMENT:` que provocó el
          # error debajo de él. Sin eso se ve que hubo un fallo pero no cuál.
          errores=$(printf '%s\n' "$registro" | grep -n -A 2 -E 'ERROR:|FATAL:|PANIC:|deadlock|could not' | head -90)

          if [ -n "$errores" ]; then
            printf '%s\n' "$errores"
          else
            echo 'El servidor no registró ningún error.'
            echo 'Si el job cayó con 25P02, el primer fallo pudo ser del cliente y no'
            echo 'del servidor: revise entonces las últimas líneas de aquí abajo.'
          fi
          echo '::endgroup::'

          echo '::group::Últimas 300 líneas del servidor PostgreSQL'
          printf '%s\n' "$registro" | tail -300
          echo '::endgroup::'

  frontend:
    name: Frontend · tipos, lint y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sgth-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sgth-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Los tres pasos de la regla 10. No son formalidades: durante la revisión
      # del módulo SSO cazaron errores reales varias veces —un genérico de Zod
      # que no estrechaba el tipo, imports que quedaban huérfanos tras cada
      # refactor—, y el frontend no tiene más red que esta.
      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint de código y de CSS
        run: npm run lint

      - name: Build de producción
        run: npm run build
