# docker-compose.dev.yml
# Solo bases de datos para desarrollo local con Laragon
# Laravel y Next.js corren nativamente en Laragon

name: sgth-dev

services:

  # ── PostgreSQL 18 ──────────────────────────────────────────────
  postgres:
    image: postgres:18
    container_name: sgth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sgth_password_dev
      POSTGRES_DB: sgth_desarrollo
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - sgth_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sgth_network

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sgth_redis
    restart: unless-stopped
    command: redis-server --requirepass sgth_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - sgth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "sgth_redis_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sgth_network

  # ── pgAdmin 4 (interfaz visual para PostgreSQL) ────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgth_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gadpe.gob.ec
      PGADMIN_DEFAULT_PASSWORD: sgth_admin_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - sgth_pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sgth_network

volumes:
  sgth_postgres_data:
    driver: local
  sgth_redis_data:
    driver: local
  sgth_pgadmin_data:
    driver: local

networks:
  sgth_network:
    driver: bridge